pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localFile = file("local.properties")
        if (localFile.exists()) {
            localFile.withInputStream { properties.load(it) }
        }
        def path = properties.getProperty("flutter.sdk")
        if (path == null || path.trim().isEmpty()) {
            path = System.getenv("FLUTTER_ROOT")
        }
        assert path != null && !path.trim().isEmpty() : "Flutter SDK not found. Set flutter.sdk in android/local.properties or FLUTTER_ROOT."
        return path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

rootProject.name = "javix"
include ":app"
