name: JARVIS - FINAL BUILD

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" platform-tools 'platforms;android-36' 'build-tools;36.0.0'

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC="$(find . -type f -name pubspec.yaml -not -path './.git/*' -print -quit || true)"
          if [ -z "$PUBSPEC" ]; then
            ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit || true)"
            test -n "$ZIP_FILE"
            rm -rf .javix_project
            mkdir -p .javix_project
            unzip -q -o "$ZIP_FILE" -d .javix_project
            PUBSPEC="$(find .javix_project -type f -name pubspec.yaml -print -quit || true)"
          fi
          test -n "$PUBSPEC"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          [ -n "$PROJECT_DIR" ] || PROJECT_DIR='.'
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Repair Android project files before Gradle starts
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          test -f android/settings.gradle
          test -f android/app/build.gradle
          grep -q 'dev.flutter.flutter-plugin-loader' android/settings.gradle
          grep -q 'dev.flutter.flutter-gradle-plugin' android/app/build.gradle
          sed -i 's/gradle-[0-9.]*-bin.zip/gradle-8.14.3-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Create Gradle wrapper outside JAVIX project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          rm -rf /tmp/javix-wrapper
          mkdir -p /tmp/javix-wrapper
          cd /tmp/javix-wrapper
          printf 'rootProject.name = "wrapper-generator"\n' > settings.gradle
          printf 'tasks.register("noop")\n' > build.gradle
          gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          cp gradlew "$GITHUB_WORKSPACE/$PROJECT_DIR/android/gradlew"
          mkdir -p "$GITHUB_WORKSPACE/$PROJECT_DIR/android/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.jar"
          cp gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          chmod +x "$GITHUB_WORKSPACE/$PROJECT_DIR/android/gradlew"
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR/android"
          ./gradlew --version

      - name: Auto repair and build
        shell: bash
        run: |
          set -euo pipefail
          export JARVIS_BACKEND_URL="${{ vars.JARVIS_BACKEND_URL || '' }}"
          cd "$PROJECT_DIR"
          chmod +x tool/auto_repair_build.sh
          MAX_ATTEMPTS=6 ./tool/auto_repair_build.sh

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" -type f -name '*.apk' -print -quit || true)"
          test -n "$APK"
          test -s "$APK"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
