name: Build JAVIX APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""

          for candidate in \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
            exit 1
          fi

          echo "Using Android SDK manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate or extract JAVIX Flutter project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          PUBSPEC="$(find . -type f -name pubspec.yaml \
            -not -path './.git/*' \
            -print -quit || true)"

          if [ -n "$PUBSPEC" ]; then
            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          if [ -z "$PROJECT_DIR" ]; then

            ZIP_FILE="$(find . -type f \
              \( \
                -iname 'javix_android_with_icon.zip' \
                -o -iname 'JAVIX_FULL_ANDROID_READY.zip' \
                -o -iname '*.zip' \
              \) \
              -not -path './.git/*' \
              -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Flutter project or ZIP file found."

              find . -maxdepth 4 -type f \
                -not -path './.git/*' \
                -print | sort

              exit 1
            fi

            echo "Extracting: $ZIP_FILE"

            rm -rf .javix_project
            mkdir -p .javix_project

            unzip -q -o "$ZIP_FILE" -d .javix_project

            PUBSPEC="$(find .javix_project -type f \
              -name pubspec.yaml \
              -print -quit || true)"

            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: pubspec.yaml was not found inside the ZIP."

              find .javix_project -maxdepth 5 -type f \
                -print | sort

              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -d "$PROJECT_DIR/android"
          test -f "$PROJECT_DIR/android/settings.gradle"
          test -f "$PROJECT_DIR/android/app/build.gradle"

          echo "Flutter project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"


          chmod +x gradlew

          ./gradlew --version

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter --version

          flutter pub get

      - name: Analyze Dart code
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze || true

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --no-tree-shake-icons

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name '*.apk' \
            -print -quit || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."

            find "$PROJECT_DIR/build" \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAVIX-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
