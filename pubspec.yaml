name: jarvis
description: JARVIS advanced personal assistant - User & Developer editions
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: any
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.13.1
  google_mlkit_object_detection: ^0.13.0
  mqtt_client: ^10.5.1
  http: ^1.3.0
  local_auth: ^2.3.0
  in_app_purchase: ^3.2.1
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
